#stock module
server:
  profiles: prod
  port: 8081

spring:
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false
  datasource:
    hikari:
      maximum-pool-size: 20    # 최대 커넥션 풀 크기 증가 (기본값 10 → 50)
      minimum-idle: 10         # 최소 대기 커넥션 개수 증가 (5 → 15) (빠른 커넥션 재사용 가능)
      idle-timeout: 30000      # 유휴 커넥션 제거 시간 증가 (30초 → 60초)
      max-lifetime: 1800000    # 커넥션 최대 수명 증가 (30분 → 1시간)
      connection-timeout: 30000 # 커넥션 획득 대기 시간 유지 (30초)
    url: ${MY_URL}
    username: ${MY_USERNAME}
    password: ${MY_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        show_sql: false
        format_sql: false
        use_sql_comments: true
        hbm2ddl:
          auto: update
        default_batch_fetch_size: 1000
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  redis:
    sentinel:
      master: mymaster
      nodes:
        - ${REDIS_SENTINEL_NODE1}:${REDIS_SENTINEL_PORT}
        - ${REDIS_SENTINEL_NODE2}:${REDIS_SENTINEL_PORT}
    password: ${REDIS_PASSWORD}
  kafka:
    producer:
      bootstrap-servers: ${SPRING_KAFKA_PRODUCER_BOOTSTRAP_SERVERS}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 10
      properties:
        retry.backoff.ms: 1000
        delivery.timeout.ms: 12000
        linger.ms: 0
        request.timeout.ms: 3000
        max.in.flight.requests.per.connection: 5
        enable.idempotence: true
      transaction-id-prefix: "stock-service-${random.value}-"
    consumer:
      bootstrap-servers: ${SPRING_KAFKA_CONSUMER_BOOTSTRAP_SERVERS}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: stock-group
      properties:
        spring.json.trusted.packages: "*"

community:
  commands:
    topic:
      checkStock: community.check-stock-topic

stock:
  events:
    topic:
      finishedPost: community.finished-post-topic
      rollback: community.rollback-topic
  commands:
    topic:
      setMileage: stock.set-mileage-topic


appkey: ${APP_KEY}
appsecret: ${APP_SECRET}

feign:
  piggyBank-url: ${PIGGYBANK_URL:localhost:8082}
  stock-url: ${STOCK_URL:localhost:8081}
  community-url: ${COMMUNITY_URL:localhost:8080}

