apiVersion: apps/v1
kind: Deployment
metadata:
  name: be-stock
  namespace: be-namespace
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1  # 한 번에 다운될 수 있는 최대 개수 (1개)
      maxSurge: 1        # 한 번에 추가로 생성할 수 있는 최대 개수 (1개)
  selector:
    matchLabels:
      app: be-stock
  template:
    metadata:
      labels:
        app: be-stock
    spec:
      containers:
      - name: be-stock
        image: jiwonchoe/stock-module:v1.34
        imagePullPolicy: Always  # ⭐️ 항상 최신 이미지로 업데이트
        resources:
          requests:
            cpu: "200m"
          limits:
            cpu: "500m"
        envFrom:
          - configMapRef:
              name: stock-configmap
          - secretRef:
              name: stock-secrets
        env:
          - name: SPRING_PROFILES_ACTIVE
            value: "prod"
          # Sentinel 모드를 위한 프로퍼티 (대문자 + 언더스코어 사용)
          - name: SPRING_REDIS_SENTINEL_MASTER
            value: "mymaster"
          - name: SPRING_REDIS_SENTINEL_NODES
            value: "my-redis-node-0.my-redis-headless.db-namespace.svc.cluster.local:26379,my-redis-node-1.my-redis-headless.db-namespace.svc.cluster.local:26379"
          # Redis 비밀번호는 Secret에서 가져옵니다.
          - name: SPRING_REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-redis
                key: redis-password
        ports:
        - containerPort: 8081
        readinessProbe:
          httpGet:
            path: /healthz/ready  # 애플리케이션의 헬스체크 엔드포인트
            port: 8081
          initialDelaySeconds: 10   # 컨테이너 시작 후 첫 번째 체크 대기 시간
          periodSeconds: 10        # 헬스 체크 주기
          timeoutSeconds: 2        # 각 체크에 대한 타임아웃 시간
          failureThreshold: 3      # 실패한 연속 횟수에 대한 임계값
          successThreshold: 1      # 성공한 연속 횟수에 대한 임계값